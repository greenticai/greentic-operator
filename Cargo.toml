bin = [
    { name = "greentic-operator", path = "src/main.rs" },
]

[package]
name = "greentic-operator"
version = "1.2.1"
edition = "2024"
rust-version = "1.95"
description = "Greentic operator CLI for local dev and demo orchestration."
license = "MIT"
repository = "https://github.com/greenticai/greentic-operator"
homepage = "https://github.com/greenticai/greentic-operator"
readme = "README.md"
autobins = false
include = [
    "src/**",
    "i18n/operator_cli/*.json",
    "i18n/operator_wizard/*.json",
    "README.md",
    "Cargo.toml",
    "Cargo.lock",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
pkg-fmt = "tgz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

# The release workflow publishes Windows archives as .zip (windows-archive-format
# in release-binaries.yml). Without these overrides cargo-binstall looks for a
# .tgz that does not exist, falls back to `cargo install`, and that collides with
# an already-installed greentic-operator.exe.
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
directories-next = "2"
# Must resolve to the SAME copy `greentic-deployer` and `greentic-runner-host` pull:
# `EnvId` / `Environment` / `EnvironmentHostConfig` / `SpecError` cross those
# boundaries in `src/deployments/`, so two copies stop unifying (E0308).
#
# Moved from ">=0.2.6, <0.3" onto the 1.2.0-dev lane: deploy-spec is now
# published as 1.2.0-dev.<runid> alongside the deployer, and current
# greentic-deployer / greentic-runner-host / greentic-operator-trust all require
# it from that lane. The old 0.2 range resolved a second copy
# (0.2.34018717538) as soon as `cargo update` took those crates.
greentic-deploy-spec = ">=1.2.0-0, <1.3.0-0"
# Floor 1.1.0-dev.26948183687: `op extensions` noun (compiled into this CLI via OpCommand).
greentic-deployer = ">=1.2.0-0, <1.3.0-0"
greentic-setup = ">=1.2.0-0, <1.3.0-0"
greentic-qa-lib = ">=1.2.0-0, <1.3.0-0"
greentic-state = ">=1.2.0-0, <1.3.0-0"
http-body-util = "0.1"
hyper-util = "0.1"
include_dir = "0.7"
jsonschema = "0.45"
libc = "0.2"
once_cell = "1.21"
qa-spec = ">=1.2.0-0, <1.3.0-0"
rand = "0.10"
rpassword = "7"
semver = "1"
serde_cbor = "0.11"
serde_json = "1.0"
sys-locale = "0.3"
sysinfo = "0.38"
tracing = "0.1"
tracing-subscriber = "0.3"
tar = "0.4"
ulid = "1"
unic-langid = "0.9"
zip = "8"

[dependencies.clap]
version = "4.5"
features = [
    "derive",
]

[dependencies.greentic-distributor-client]
version = ">=1.2.0-0, <1.3.0-0"
default-features = false
features = [
    "pack-fetch",
]

[dependencies.greentic-interfaces]
version = ">=1.2.0-0, <1.3.0-0"

[dependencies.greentic-interfaces-guest]
version = ">=1.2.0-0, <1.3.0-0"

[dependencies.greentic-interfaces-host]
version = ">=1.2.0-0, <1.3.0-0"

[dependencies.greentic-interfaces-wasmtime]
version = ">=1.2.0-0, <1.3.0-0"

[dependencies.greentic-runner-desktop]
version = ">=1.2.0-0, <1.3.0-0"

# Floor 1.1.6, not 1.1.1: `HostConfig.{agents,graphs}` and `FlowContext.reply_scope`
# (constructed in src/demo/) first exist in 1.1.1, so 1.1.1 is the API floor — a fresh
# resolve against 1.1.0 fails with E0063, which the lockfile hides and a `--locked`
# consumer with a stale lock does not. 1.1.6 is the security floor: every publish below
# it pins `async-nats = "0.46"` -> `rustls-webpki 0.102.8`, which carries GHSA-82j2-j2ch-gfr8
# (high) and GHSA-pwjx-qhcg-rvj4 with no fixed 0.102.x; async-nats only moved to the patched
# 0.103 line in 0.47.
# Floor 1.2.0-dev.29565371086: the first dev publish built against deploy-spec
# 0.2 (greentic-runner#599). runner-host's ids cross into `src/deployments/`
# alongside the deployer's, so a resolve that picks an earlier dev publish —
# 1.2.0-dev.29558260044 and older declare deploy-spec ">=0.1.0-0, <0.2.0-0" —
# drags a second deploy-spec copy back in and reintroduces the E0308 this floor
# exists to prevent. An API floor, not a preference: don't lower it.
# Floor 1.2.0-dev.36239801430: `FlowContext.caller` (constructed in src/demo/runner.rs), and
# runner-host makes `agentic-worker` a default feature, which compiles
# `HostConfig.{agents,graphs}` in. Both are filled in src/demo/.
[dependencies.greentic-runner-host]
version = ">=1.2.0-0, <1.3.0-0"

[dependencies.greentic-secrets-lib]
version = ">=1.2.0-0, <1.3.0-0"
features = [
    "providers-dev",
]

[dependencies.greentic-telemetry]
version = ">=1.2.0-0, <1.3.0-0"
features = [
    "otlp",
    "fmt",
]

[dependencies.greentic-types]
version = ">=1.2.0-0, <1.3.0-0"
features = [
    "serde",
]

[dependencies.hyper]
version = "1"
features = [
    "full",
]

[dependencies.oci-distribution]
version = "0.11"
default-features = false
features = [
    "rustls-tls",
]

[dependencies.serde]
version = "1.0"
features = [
    "derive",
]

[dependencies.serde_yaml_bw]
package = "serde_yaml_gtc"
version = "2.5.2"

[dependencies.tokio]
version = "1"
features = [
    "rt-multi-thread",
    "sync",
    "signal",
    "net",
]

[dependencies.ureq]
version = "3"
features = [
    "json",
]

[dependencies.uuid]
version = "1"
features = [
    "v4",
]

[dev-dependencies]
indexmap = "2"
tempfile = "3.10"

[workspace]
members = [
    "secret_name",
    "crates/greentic-secrets-repro",
]

[workspace.dependencies]
anyhow = "1.0"
tempfile = "3.10"
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.dependencies.tokio]
version = "1"
features = [
    "rt-multi-thread",
    "sync",
    "signal",
    "net",
]

[workspace.dependencies.greentic-secrets-lib]
version = ">=1.2.0-0, <1.3.0-0"
features = [
    "providers-dev",
]

[workspace.dependencies.uuid]
version = "1"
features = [
    "v4",
]
