bin = [
    { name = "greentic-start", path = "src/main.rs" },
]

[package]
edition = "2024"
rust-version = "1.91"
name = "greentic-start"
version = "1.2.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Greentic lifecycle runner for start/restart/stop orchestration"
homepage = "https://github.com/greenticai/greentic-start"
readme = "README.md"
keywords = [
    "greentic",
    "cli",
    "lifecycle",
    "orchestration",
]
categories = [
    "command-line-utilities",
    "development-tools",
]
license = "MIT"
repository = "https://github.com/greenticai/greentic-start"

[lib]
name = "greentic_start"
path = "src/lib.rs"

[dependencies.anyhow]
version = "1.0"

[dependencies.async-trait]
version = "0.1"

[dependencies.base64]
version = "0.22"

[dependencies.chrono]
version = "0.4"

[dependencies.clap]
version = "4.5"
features = [
    "derive",
]

[dependencies.flate2]
version = "1"

[dependencies.axum]
version = "0.8"
features = [
    "json",
]

[dependencies.greentic-distributor-client]
version = ">=1.2.0-0, <1.3.0-0"
features = [
    "pack-fetch",
]
default-features = false

[dependencies.greentic-setup]
version = ">=1.2.0-0, <1.3.0-0"

[dependencies.greentic-runner-desktop]
version = ">=1.2.0-0, <1.3.0-0"

[dependencies.greentic-runner-host]
version = ">=1.2.0-0, <1.3.0-0"

[dependencies.greentic-secrets-lib]
version = ">=1.2.0-0, <1.3.0-0"
features = [
    "providers-dev",
]

[dependencies.greentic-types]
version = ">=1.2.0-0, <1.3.0-0"
features = [
    "serde",
]

[dependencies.http-body-util]
version = "0.1"

[dependencies.hyper]
version = "1"
features = [
    "full",
]

[dependencies.hyper-util]
version = "0.1"

[dependencies.include_dir]
version = "0.7"

[dependencies.jsonschema]
version = "0.44"

[dependencies.libc]
version = "0.2"

[dependencies.once_cell]
version = "1.21"

[dependencies.qa-spec]
version = ">=1.2.0-0, <1.3.0-0"

[dependencies.rand]
version = "0.10"

[dependencies.rpassword]
version = "7"

[dependencies.rustls]
version = "0.23"

[dependencies.rustls-pemfile]
version = "2"

[dependencies.tokio-rustls]
version = "0.26"

[dependencies.semver]
version = "1"

[dependencies.serde]
version = "1.0"
features = [
    "derive",
]

[dependencies.serde_cbor]
version = "0.11"

[dependencies.serde_json]
version = "1.0"

[dependencies.serde_yaml_bw]
version = "2.5.2"
package = "serde_yaml_gtc"

[dependencies.sha2]
version = "0.10"

[dependencies.sys-locale]
version = "0.3"

[dependencies.sysinfo]
version = "0.38"

[dependencies.tar]
version = "0.4"

[dependencies.tokio]
version = "1"
features = [
    "rt-multi-thread",
    "signal",
    "sync",
    "net",
]

[dependencies.tracing]
version = "0.1"

[dependencies.unic-langid]
version = "0.9"

[dependencies.ureq]
version = "3"
features = [
    "json",
]

[dependencies.uuid]
version = "1"
features = [
    "v4",
]

[dependencies.zip]
version = "8"

[dependencies.zstd]
version = "0.13"

[dev-dependencies.tempfile]
version = "3"
